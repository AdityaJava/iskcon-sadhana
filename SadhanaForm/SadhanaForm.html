<html>
  <head>
    <title>Sadhana Form</title>
    <link rel="stylesheet" href="SadhanaForm.css" />
  </head>
  <body>
    <div>
      <form id="sadhana-form" class="sadhana-form">
        <label>
          Date:
          <input type="date" id="sadhana-form-date" />
        </label>
        <label>
          To Bed:
          <input type="time" id="sadhana-form-to-bed-time" /> </label
        ><label>
          Wake up:
          <input type="time" id="sadhana-form-wake-up-time" /> </label
        ><label>
          Chanted Rounds:
          <input type="number" id="sadhana-form-chanted-rounds" />
        </label>
      </form>
    </div>
  </body>
</html>
